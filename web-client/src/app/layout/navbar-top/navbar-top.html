<header class="flex items-center justify-between border-b border-gray-200 bg-white px-4 py-3">
  <span class="text-lg font-semibold text-gray-900 md:hidden">🏓 Table Tennis Trainer</span>

  <button
    type="button"
    (click)="toggleSidebar.emit()"
    class="hidden items-center justify-center rounded-md p-2 text-gray-500 hover:bg-gray-100 md:inline-flex"
    aria-label="Colapsar menú"
  >
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="block">
      <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
    </svg>
  </button>

  <button
    type="button"
    (click)="logout()"
    class="inline-flex items-center justify-center rounded-md p-2 text-gray-500 hover:bg-gray-100"
    aria-label="Cerrar sesión"
  >
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="block">
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15M12 9l3 3m0 0-3 3m3-3H3"
      />
    </svg>
  </button>
</header>
