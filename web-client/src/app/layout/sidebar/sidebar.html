<aside
  class="hidden h-full flex-col border-r border-gray-200 bg-white transition-all md:flex"
  [class.w-56]="!collapsed()"
  [class.w-16]="collapsed()"
>
  <div class="flex flex-col items-center gap-2 px-4 py-4">
    <span
      class="inline-flex h-9 w-9 items-center justify-center rounded-full bg-brand-50 text-brand-700"
    >
      <svg
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        class="block"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M12 12a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9Zm0 0c-4.142 0-7.5 2.686-7.5 6v1.5h15V18c0-3.314-3.358-6-7.5-6Z"
        />
      </svg>
    </span>
    @if (!collapsed()) {
      <span class="text-sm font-medium text-gray-700">{{ user()?.name }}</span>
    }
  </div>

  <hr class="mb-2 border-gray-200" />

  <nav class="flex flex-col gap-1 px-2">
    <a
      routerLink="/home"
      routerLinkActive="bg-brand-50 text-brand-700"
      class="flex items-center gap-3 rounded-md px-3 py-2 text-sm font-medium text-gray-700 hover:bg-gray-100"
      [class.justify-center]="collapsed()"
    >
      <svg
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        class="block shrink-0"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25"
        />
      </svg>
      @if (!collapsed()) {
        <span>Home</span>
      }
    </a>
    @if (isAdmin()) {
      <a
        routerLink="/jugadores"
        routerLinkActive="bg-brand-50 text-brand-700"
        class="flex items-center gap-3 rounded-md px-3 py-2 text-sm font-medium text-gray-700 hover:bg-gray-100"
        [class.justify-center]="collapsed()"
      >
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          class="block shrink-0"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M15 19.128a9.38 9.38 0 0 0 2.625.372 9.337 9.337 0 0 0 4.121-.952 4.125 4.125 0 0 0-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 0 1 8.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0 1 11.964-3.07M12 6.375a3.375 3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0Zm8.25 2.25a2.625 2.625 0 1 1-5.25 0 2.625 2.625 0 0 1 5.25 0Z"
          />
        </svg>
        @if (!collapsed()) {
          <span>Jugadores</span>
        }
      </a>
    }
    <a
      routerLink="/calendario"
      routerLinkActive="bg-brand-50 text-brand-700"
      class="flex items-center gap-3 rounded-md px-3 py-2 text-sm font-medium text-gray-700 hover:bg-gray-100"
      [class.justify-center]="collapsed()"
    >
      <svg
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        class="block shrink-0"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5"
        />
      </svg>
      @if (!collapsed()) {
        <span>Calendario</span>
      }
    </a>

    @if (isAdmin()) {
      <a
        routerLink="/coach-mode"
        routerLinkActive="bg-brand-50 text-brand-700"
        class="flex items-center gap-3 rounded-md px-3 py-2 text-sm font-medium text-gray-700 hover:bg-gray-100"
        [class.justify-center]="collapsed()"
      >
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          class="block shrink-0"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M12 9a3.75 3.75 0 1 0 0 7.5A3.75 3.75 0 0 0 12 9Zm0 0V4.5m0 4.5-3.181 3.181M2.995 12h4.5m-4.5 0a9 9 0 1 0 18 0m-18 0a9 9 0 1 1 18 0"
          />
        </svg>
        @if (!collapsed()) {
          <span>Modo Entrenador</span>
        }
      </a>
      <a
        routerLink="/modo-coach"
        routerLinkActive="bg-brand-50 text-brand-700"
        class="flex items-center gap-3 rounded-md px-3 py-2 text-sm font-medium text-gray-700 hover:bg-gray-100"
        [class.justify-center]="collapsed()"
      >
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          class="block shrink-0"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M9 4.5v15m6-15v15M4.5 9h4.5m6 0h4.5M4.5 15h4.5m6 0h4.5M4.5 4.5h15v15h-15v-15Z"
          />
        </svg>
        @if (!collapsed()) {
          <span>Modo Coach</span>
        }
      </a>
    }

    <hr class="my-2 border-gray-200" />

    <a
      routerLink="/ajustes"
      routerLinkActive="bg-brand-50 text-brand-700"
      class="flex items-center gap-3 rounded-md px-3 py-2 text-sm font-medium text-gray-700 hover:bg-gray-100"
      [class.justify-center]="collapsed()"
    >
      <svg
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        class="block shrink-0"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.324.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.431l-1.003.827c-.293.24-.438.613-.431.992a6.759 6.759 0 0 1 0 .255c-.007.378.138.75.43.99l1.005.828c.424.35.534.954.26 1.43l-1.298 2.247a1.125 1.125 0 0 1-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.57 6.57 0 0 1-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.542-.56.94-1.11.94h-2.594c-.55 0-1.02-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 0 1-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 0 1-1.369-.49l-1.297-2.247a1.125 1.125 0 0 1 .26-1.431l1.004-.827c.292-.24.437-.613.43-.992a6.932 6.932 0 0 1 0-.255c.007-.378-.138-.75-.43-.99l-1.004-.828a1.125 1.125 0 0 1-.26-1.43l1.297-2.247a1.125 1.125 0 0 1 1.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.087.22-.128.332-.183.582-.495.644-.869l.214-1.28Z"
        />
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"
        />
      </svg>
      @if (!collapsed()) {
        <span>Ajustes</span>
      }
    </a>
  </nav>
</aside>
