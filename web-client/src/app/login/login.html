<div class="login-page">
  <section class="login-side login-side--brand">
    <div class="brand-content">
      <div class="brand-logo">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="brand-icon">
          <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.5" />
          <path d="M8 14.5 12 8l4 6.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </div>
      <h1 class="brand-title">Table Tennis Trainer</h1>
      <p class="brand-subtitle">Entrena mejor, juega mejor.</p>

      <ul class="brand-features">
        <li>
          <span class="feature-dot"></span>
          Seguimiento de tus entrenamientos
        </li>
        <li>
          <span class="feature-dot"></span>
          Estadísticas de rendimiento
        </li>
        <li>
          <span class="feature-dot"></span>
          Planes personalizados
        </li>
      </ul>
    </div>

    <div class="brand-decoration brand-decoration--top"></div>
    <div class="brand-decoration brand-decoration--bottom"></div>
  </section>

  <section class="login-side login-side--form">
    <div class="form-wrapper">
      <header class="form-header">
        <h2 class="form-title">Iniciar sesión</h2>
        <p class="form-subtitle">Bienvenido de nuevo, ingresa tus datos.</p>
      </header>

      <form class="login-form" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="email" class="form-label">Correo electrónico</label>
          <input id="email" name="email" type="email" class="form-input" placeholder="tu@correo.com" autocomplete="email" [(ngModel)]="email" />
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Contraseña</label>
          <input id="password" name="password" type="password" class="form-input" placeholder="••••••••" autocomplete="current-password" [(ngModel)]="password" />
        </div>

        <div class="form-row">
          <label class="checkbox-label">
            <input type="checkbox" name="remember" class="checkbox-input" />
            Recordarme
          </label>
          <a href="#" class="form-link">¿Olvidaste tu contraseña?</a>
        </div>

        <button type="submit" class="submit-button">Ingresar</button>
      </form>

      <p class="form-footer">
        ¿No tienes una cuenta?
        <a href="#" class="form-link form-link--strong">Regístrate</a>
      </p>
    </div>
  </section>
</div>
