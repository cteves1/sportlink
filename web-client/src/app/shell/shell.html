<div class="dashboard-layout">
  <p-toolbar styleClass="topbar">
    <ng-template #start>
      <div class="topbar-brand">
        <span class="pi pi-circle-fill brand-dot"></span>
        <span class="brand-name">Table Tennis Trainer</span>
      </div>
    </ng-template>

    <ng-template #end>
      <div class="topbar-actions">
        <span class="topbar-user">{{ user()?.name ?? 'Jugador' }}</span>
        <p-avatar [label]="user()?.avatarInitials ?? 'JT'" shape="circle" styleClass="topbar-avatar"></p-avatar>
        <p-button icon="pi pi-sign-out" label="Salir" size="small" severity="secondary" [text]="true" (onClick)="logout()"></p-button>
      </div>
    </ng-template>
  </p-toolbar>

  <div class="dashboard-body">
    <aside class="sidebar" [class.sidebar--collapsed]="sidebarCollapsed()">
      <button
        type="button"
        class="sidebar-collapse-toggle"
        [attr.aria-label]="sidebarCollapsed() ? 'Expandir menú' : 'Colapsar menú'"
        (click)="toggleSidebar()"
      >
        <span [class]="sidebarCollapsed() ? 'pi pi-angle-right' : 'pi pi-angle-left'"></span>
      </button>
      <p-menu [model]="menuItems()" styleClass="sidebar-menu"></p-menu>
    </aside>

    <main class="main-panel">
      <ng-content></ng-content>
    </main>
  </div>

  <footer class="bottombar">
    <span>&copy; 2026 Table Tennis Trainer</span>
    <span class="bottombar-links">
      <a href="#">Ayuda</a>
      <a href="#">Privacidad</a>
      <a href="#">Términos</a>
    </span>
  </footer>

  <button
    type="button"
    class="theme-toggle-fab"
    [attr.aria-label]="isDark() ? 'Activar modo claro' : 'Activar modo oscuro'"
    (click)="toggleTheme()"
  >
    <span [class]="isDark() ? 'pi pi-sun' : 'pi pi-moon'"></span>
  </button>
</div>
