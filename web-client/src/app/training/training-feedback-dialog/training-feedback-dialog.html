<p-dialog [(visible)]="visible" [modal]="true" [style]="{ width: '30rem', maxWidth: '95vw' }" [draggable]="false" [resizable]="false" [header]="mode() === 'coach' ? 'Evaluación del entrenador' : 'Feedback del jugador'">
  <div class="feedback-form">
    @if (mode() === 'coach') {
      <div class="form-field">
        <label for="intensity">Intensidad (1-10)</label>
        <p-inputnumber id="intensity" [(ngModel)]="intensity" [min]="1" [max]="10" [useGrouping]="false"></p-inputnumber>
      </div>

      <div class="form-field">
        <label for="performance">Rendimiento (1-10)</label>
        <p-inputnumber id="performance" [(ngModel)]="performance" [min]="1" [max]="10" [useGrouping]="false"></p-inputnumber>
      </div>

      <div class="form-field form-field--full">
        <label for="observations">Observaciones</label>
        <textarea id="observations" pTextarea [(ngModel)]="observations" rows="4" placeholder="Observaciones sobre la sesión"></textarea>
      </div>
    } @else {
      <div class="form-field form-field--full">
        <label for="feelings">Sensaciones</label>
        <textarea id="feelings" pTextarea [(ngModel)]="feelings" rows="3" placeholder="Cómo te sentiste durante la sesión"></textarea>
      </div>

      <div class="form-field">
        <label for="difficulty">Dificultad (1-10)</label>
        <p-inputnumber id="difficulty" [(ngModel)]="difficulty" [min]="1" [max]="10" [useGrouping]="false"></p-inputnumber>
      </div>

      <div class="form-field form-field--full">
        <label for="comments">Comentarios</label>
        <textarea id="comments" pTextarea [(ngModel)]="comments" rows="3" placeholder="Comentarios adicionales"></textarea>
      </div>
    }

    <div class="feedback-actions">
      <p-button [label]="mode() === 'coach' ? 'Guardar evaluación' : 'Guardar feedback'" icon="pi pi-check" (onClick)="save()"></p-button>
    </div>
  </div>
</p-dialog>
